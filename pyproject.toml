[project]
name = "voice-server"
version = "0.1.0"
description = "로컬 설치형 TTS·ASR 웹 서비스 — 오케스트레이션 서버(엔진은 격리된 작업자 프로세스)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "python-multipart==0.0.20",
    "pydantic==2.11.9",
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "scipy==1.16.2",
    "librosa==0.11.0",
    "psutil==7.1.0",
    "nvidia-ml-py==13.580.82",
    "huggingface-hub==0.35.3",
    "imageio-ffmpeg==0.6.0",
]

[project.scripts]
voice-server = "voice_server.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/voice_server"]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
